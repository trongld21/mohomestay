name: langhome

services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: langhome
      POSTGRES_DB: langhomestay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run docker:setup first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    image: langhome-migrate:local
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://langhome:${POSTGRES_PASSWORD}@db:5432/langhomestay
      DIRECT_URL: postgresql://langhome:${POSTGRES_PASSWORD}@db:5432/langhomestay
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    image: langhome-web:local
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3200}
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgresql://langhome:${POSTGRES_PASSWORD}@db:5432/langhomestay
      DIRECT_URL: postgresql://langhome:${POSTGRES_PASSWORD}@db:5432/langhomestay
      NEXTAUTH_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3200}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3200}
    ports:
      - "127.0.0.1:${APP_PORT:-3200}:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
