name: Deploy PHP via DirectAdmin API
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: production-directadmin
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  test-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    services:
      mariadb:
        image: mariadb:10.3.16
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: counter_migration_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup PHP
        uses: shivammathur/setup-php@2.35.5
        with:
          php-version: '8.2'
          extensions: curl, mbstring, pdo_mysql, zip, pdo_sqlite
          coverage: none
      - name: Check PHP syntax
        run: find src public tools -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Verify SQL migrations on hosting MariaDB version
        env:
          COUNTER_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=counter_migration_test;charset=utf8mb4
          COUNTER_TEST_USER: root
          COUNTER_TEST_PASSWORD: ''
        run: php tools/people-counter-migration-test.php
      - name: Run unit tests
        run: |
          php tools/test.php
          php tools/deploy-agent-test.php
          php tools/directadmin-deploy-test.php
          php tools/ttlock-test.php
          php tools/booking-access-test.php
          php tools/booking-identity-test.php
          php tools/manual-access-test.php
          php tools/room-test.php
          php tools/room-discount-test.php
          php tools/upload-test.php
          php tools/ui-test.php
          php tools/check.php
          php tools/account-test.php
          php tools/people-counter-test.php
          php tools/people-counter-preview-test.php
          php tools/people-counter-deploy-test.php
          php tools/imou-test.php
          node --check public/assets/app.js
          node --check public/assets/ui.js
          node --check public/assets/admin.js
          node --check public/assets/admin-booking-filters.js
          node tools/admin-booking-filters-test.cjs
          node --check public/assets/rooms.js
          node --check public/assets/booking-identity.js
          node --check public/assets/door-codes.js
          node --check public/assets/people-counter.js
          node --check public/assets/people-counter-offline.js
          node tools/people-counter-offline-test.cjs
      - name: Build DirectAdmin upload package
        run: |
          mkdir -p .deploy/public_html
          rsync -a --exclude 'uploads/' --exclude '*.[zZ][iI][pP]' public/ .deploy/public_html/
          # Deploy PHP runtime files only; Tailwind source is a local build input.
          rsync -a --exclude 'styles/' src/ .deploy/src/
          cp -R database .deploy/
          # DirectAdmin/ModSecurity commonly blocks .htaccess in HTTP multipart uploads.
          rm -f .deploy/public_html/.htaccess
          test ! -e .deploy/public_html/uploads
          test ! -e .deploy/src/styles
          test -s .deploy/public_html/assets/tailwind.css
          php public/deploy-hook.php --check-package .deploy
      - name: Package signed release
        env:
          DEPLOY_HOOK_KEY: ${{ secrets.DEPLOY_HOOK_KEY }}
        run: php scripts/build-directadmin-package.php .deploy/release "$GITHUB_SHA" "$GITHUB_RUN_ID"
      - name: Upload package through DirectAdmin File Manager
        env:
          DA_URL: ${{ vars.DA_URL }}
          DA_USERNAME: ${{ secrets.DA_USERNAME }}
          DA_LOGIN_KEY: ${{ secrets.DA_LOGIN_KEY }}
        run: php scripts/deploy-directadmin.php ".deploy/release/release-$GITHUB_SHA-$GITHUB_RUN_ID.zip" ".deploy/release/ready-$GITHUB_SHA-$GITHUB_RUN_ID.json"
      - name: Wait for Cron activation
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            status=$(curl --fail --silent --show-error --connect-timeout 10 --max-time 15 "https://mohomestay.vn/deploy-status.json?run=$GITHUB_RUN_ID&attempt=$attempt" || true)
            if printf '%s' "$status" | jq -e --arg sha "$GITHUB_SHA" --argjson run "$GITHUB_RUN_ID" '.release == $sha and .run_id == $run and .status == "success"' >/dev/null 2>&1; then
              exit 0
            fi
            if printf '%s' "$status" | jq -e --arg sha "$GITHUB_SHA" --argjson run "$GITHUB_RUN_ID" '.release == $sha and .run_id == $run and .status == "failed"' >/dev/null 2>&1; then
              echo "::error::Cron activation failed. Inspect private hosting deployment backups and database."
              exit 1
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for hosting Cron; do not assume the release was activated."
          exit 1
      - name: Verify production health
        run: |
          curl --fail --silent --show-error --connect-timeout 10 --max-time 20 https://mohomestay.vn/api/health | jq -e '.status == "ok"'
