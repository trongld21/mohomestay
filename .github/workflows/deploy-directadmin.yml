name: Deploy PHP to DirectAdmin
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: production-directadmin
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check PHP syntax
        run: find src public tools -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run unit tests
        run: php tools/test.php
      - name: Build DirectAdmin upload package
        run: |
          mkdir -p .deploy/public_html
          cp -R public/. .deploy/public_html/
          cp -R src database tools .deploy/
          cp .env.example .deploy/.env.example
      - name: Upload through FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./.deploy/
          server-dir: ${{ secrets.DEPLOY_REMOTE_DIR }}
          state-name: .langhome-deploy-state.json
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.env
      - name: Run database migrations
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
          DEPLOY_HOOK_KEY: ${{ secrets.DEPLOY_HOOK_KEY }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ] || [ -z "$DEPLOY_HOOK_KEY" ]; then
            echo "Deploy hook secrets are not configured; skipping migrations."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --retry 2 \
            -H "X-Deploy-Key: $DEPLOY_HOOK_KEY" "$DEPLOY_HOOK_URL"
