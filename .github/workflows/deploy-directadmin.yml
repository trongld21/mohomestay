name: Deploy PHP to DirectAdmin
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: production-directadmin
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check PHP syntax
        run: find src public tools -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run unit tests
        run: |
          php tools/test.php
          php tools/room-test.php
          php tools/upload-test.php
          php tools/ui-test.php
          php tools/check.php
          node --check public/assets/app.js
          node --check public/assets/ui.js
          node --check public/assets/admin.js
          node --check public/assets/rooms.js
      - name: Build DirectAdmin upload package
        run: |
          mkdir -p .deploy/public_html
          rsync -a --exclude 'uploads/' public/ .deploy/public_html/
          cp -R src database .deploy/
          # DirectAdmin/ModSecurity commonly blocks .htaccess in HTTP multipart uploads.
          rm -f .deploy/public_html/.htaccess
          test ! -e .deploy/public_html/uploads
      - name: Upload through signed HTTPS hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
          DEPLOY_HOOK_KEY: ${{ secrets.DEPLOY_HOOK_KEY }}
        run: |
          test -n "$DEPLOY_HOOK_URL"
          test -n "$DEPLOY_HOOK_KEY"
          find .deploy -type f -print0 | while IFS= read -r -d '' file; do
            path="${file#.deploy/}"
            digest="$(sha256sum "$file" | cut -d ' ' -f 1)"
            signature="$(printf '%s\n%s' "$path" "$digest" | openssl dgst -sha256 -hmac "$DEPLOY_HOOK_KEY" -hex | sed 's/^.* //')"
            echo "Uploading $path"
            curl --fail-with-body --silent --show-error --retry 2 \
              -H "X-Deploy-Signature: $signature" \
              -F "path=$path" -F "file=@$file" "$DEPLOY_HOOK_URL"
            echo
          done
      - name: Run database migrations
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
          DEPLOY_HOOK_KEY: ${{ secrets.DEPLOY_HOOK_KEY }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ] || [ -z "$DEPLOY_HOOK_KEY" ]; then
            echo "Deploy hook secrets are not configured; skipping migrations."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --retry 2 \
            -H "X-Deploy-Key: $DEPLOY_HOOK_KEY" "$DEPLOY_HOOK_URL"
